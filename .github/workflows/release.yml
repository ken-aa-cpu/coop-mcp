name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run full test suite
        run: uv run python tests/run_all.py
      - name: Package release archive
        run: |
          mkdir -p dist_stage
          git archive --format=zip --prefix="coop-mcp-${GITHUB_REF_NAME}/" -o "coop-mcp-${GITHUB_REF_NAME}.zip" HEAD
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "coop-mcp-${GITHUB_REF_NAME}.zip" \
            --title "CoopMCP ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md
