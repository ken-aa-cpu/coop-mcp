[project]
name = "coop-mcp"
version = "0.1.1"
description = "CoopMCP: Sandboxed HTTPS MCP gateway, OAuth 2.1 login, PIN-gated elevation, and lazy stdio/HTTP/SSE plugin router for remote AI clients"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0",
    "pillow>=11.0.0",
    "pyjwt>=2.10.0",
    "pystray>=0.19.5",
    "python-dotenv>=1.0.0",
    "starlette>=0.46.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0.0",
]

[tool.uv]
package = false

[tool.setuptools]
py-modules = [
    "admin_privilege",
    "app_registry",
    "blender_bridge",
    "config",
    "files_tools",
    "mcp_discovery",
    "media_timeline",
    "oauth_provider",
    "plugin_router",
    "server",
    "set_oauth_password",
    "tray_app",
    "ui_server",
]
